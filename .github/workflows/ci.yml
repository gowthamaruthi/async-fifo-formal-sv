name: FIFO verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  simulation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install icarus-verilog verilator yosys
      - run: bash scripts/check.sh
      - run: SEED=20260905 bash sim/run.sh
      - run: python3 scripts/parameters.py
      - run: python3 scripts/negative.py
      - run: python3 scripts/cdc_audit.py
      - run: python3 scripts/cdc_audit.py --depth 4 --width 1 --out build/cdc-minimum
      - run: python3 scripts/cdc_negative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-logs
          path: |
            build/*.log
            build/*.vcd
            build/cdc*/**
  formal:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install yosys z3
      - run: bash scripts/setup-formal.sh
      - run: bash scripts/formal.sh
      - run: python3 scripts/formal-negative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-logs-and-traces
          path: |
            formal/fifo_*/logfile.txt
            formal/fifo_*/status
            formal/fifo_*/engine_0/*.vcd
            formal/fifo_*/engine_0/*.yw
